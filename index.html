<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <title>AI German poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header><h1>AI German poem Generator</h1></header>

      <main>
        <div class="form-container">
          <form id="poem-generator-form">
            <input
              type="text"
              placeholder="Enter the topic of the German poem you'd like to generate"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e: Flower, German or Freedom</div>
        </div>
        <div class="poem hidden" id="poem"></div>
      </main>
      <footer>
        This AI project was codded by
        <a href="https://github.com" target="_blank">Nazanin Mehboudi</a> and is
        <a
          href="https://github.com/nazanin-git-i/french-poem-generator"
          target="_blank"
          >open-sourced on Github</a
        >
        and is
        <a
          href="https://app.netlify.com/projects/nazaninprojekt/overview"
          target="_blank"
          >hosted on Netlify</a
        >
        .
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
