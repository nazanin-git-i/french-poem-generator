<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI French poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header><h1>AI French poem Generator</h1></header>

      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the topic of the French poem"
            autofocus
            required
            autocomplete="off"
            class="instruction"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem">The poem will go here</div>
      </main>
      <footer>
        This AI project was codded by
        <a href="https://github.com" target="_blank">Nazanin Mehboudi</a> and is
        <a
          href="https://github.com/nazanin-git-i/french-poem-generator"
          target="_blank"
          >open-sourced on Github</a
        >
        and is hosted on
        <a
          href="https://app.netlify.com/projects/nazaninprojekt/overview"
          target="_blank"
          >Netlify</a
        >
        .
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
